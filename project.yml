name: TravelMessageApp
options:
  bundleIdPrefix: com.travelmessageapp
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "7.0.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  TravelMessageApp:
    type: application
    platform: iOS
    sources:
      - path: TravelMessageApp
        excludes:
          - Resources/Info.plist
    info:
      path: TravelMessageApp/Resources/Info.plist
      properties:
        NSLocationWhenInUseUsageDescription: "TravelMessageApp uses your location to tag messages and unlock geo-locked messages from friends."
        NSPhotoLibraryUsageDescription: "TravelMessageApp uses your photo library to attach photos to messages."
        NSCameraUsageDescription: "TravelMessageApp uses your camera to capture photos for messages."
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.travelmessageapp.app

  TravelMessageAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TravelMessageAppTests
    dependencies:
      - target: TravelMessageApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.travelmessageapp.tests
        GENERATE_INFOPLIST_FILE: YES

  TravelMessageAppIntegrationTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TravelMessageAppIntegrationTests
    dependencies:
      - target: TravelMessageApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.travelmessageapp.integrationtests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  TravelMessageApp:
    build:
      targets:
        TravelMessageApp: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TravelMessageAppTests
        - TravelMessageAppIntegrationTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
